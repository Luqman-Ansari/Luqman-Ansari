<svg viewBox="0 0 760 264" width="760" height="264" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luqman Ansari — terminal">
  <style>
    text {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 16px;
      dominant-baseline: middle;
    }
    .prompt { fill: #4DFF9E; }
    .cmd    { fill: #E6EDF5; }
    .out    { fill: #8A99AD; }
    .accent { fill: #4DFF9E; }
    .amber  { fill: #FFB454; }
    .title  { fill: #5A6B80; font-size: 13px; }

    /* typing reveal: each line wipes in left-to-right, holds, then clears on loop.
       base state is fully visible so the terminal still reads if a renderer
       ignores CSS animation (graceful degradation). */
    .line { clip-path: inset(0 0 0 0); }
    .l1 { animation: t1 11s steps(8)  infinite; }
    .l2 { animation: t2 11s steps(50) infinite; }
    .l3 { animation: t3 11s steps(15) infinite; }
    .l4 { animation: t4 11s steps(58) infinite; }
    .l5 { animation: t5 11s steps(11) infinite; }
    .l6 { animation: t6 11s steps(35) infinite; }

    @keyframes t1 { 0%{clip-path:inset(0 100% 0 0)} 7%{clip-path:inset(0 0 0 0)} 92%{clip-path:inset(0 0 0 0)} 95%,100%{clip-path:inset(0 100% 0 0)} }
    @keyframes t2 { 0%,9%{clip-path:inset(0 100% 0 0)} 18%{clip-path:inset(0 0 0 0)} 92%{clip-path:inset(0 0 0 0)} 95%,100%{clip-path:inset(0 100% 0 0)} }
    @keyframes t3 { 0%,20%{clip-path:inset(0 100% 0 0)} 28%{clip-path:inset(0 0 0 0)} 92%{clip-path:inset(0 0 0 0)} 95%,100%{clip-path:inset(0 100% 0 0)} }
    @keyframes t4 { 0%,30%{clip-path:inset(0 100% 0 0)} 44%{clip-path:inset(0 0 0 0)} 92%{clip-path:inset(0 0 0 0)} 95%,100%{clip-path:inset(0 100% 0 0)} }
    @keyframes t5 { 0%,46%{clip-path:inset(0 100% 0 0)} 54%{clip-path:inset(0 0 0 0)} 92%{clip-path:inset(0 0 0 0)} 95%,100%{clip-path:inset(0 100% 0 0)} }
    @keyframes t6 { 0%,56%{clip-path:inset(0 100% 0 0)} 70%{clip-path:inset(0 0 0 0)} 92%{clip-path:inset(0 0 0 0)} 95%,100%{clip-path:inset(0 100% 0 0)} }

    .caret { fill: #4DFF9E; animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .glow { animation: glow 3.4s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:.35} 50%{opacity:.9} }
  </style>

  <!-- pulsing glow border -->
  <rect class="glow" x="4" y="4" width="752" height="256" rx="14" fill="none" stroke="#4DFF9E" stroke-width="1"/>

  <!-- terminal window -->
  <rect x="8" y="8" width="744" height="248" rx="12" fill="#0D131C" stroke="#1B2430" stroke-width="1"/>

  <!-- scanlines -->
  <defs>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.018"/>
    </pattern>
  </defs>
  <rect x="9" y="46" width="742" height="209" fill="url(#scan)"/>

  <!-- title bar -->
  <circle cx="32"  cy="30" r="6" fill="#FF5F57"/>
  <circle cx="54"  cy="30" r="6" fill="#FFBD2E"/>
  <circle cx="76"  cy="30" r="6" fill="#28C840"/>
  <text class="title" x="104" y="31">luqman@github: ~/profile</text>
  <line x1="8" y1="46" x2="752" y2="46" stroke="#1B2430" stroke-width="1"/>

  <!-- body -->
  <text class="line l1" x="34" y="82">
    <tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan>
  </text>
  <text class="line l2 out" x="34" y="112">luqman-ansari · genai engineer @ emumba · islamabad</text>

  <text class="line l3" x="34" y="142">
    <tspan class="prompt">$ </tspan><tspan class="cmd">cat stack.txt</tspan>
  </text>
  <text class="line l4 out" x="34" y="172">python · aws · bedrock · sagemaker · rag · llms · pydantic-ai</text>

  <text class="line l5" x="34" y="202">
    <tspan class="prompt">$ </tspan><tspan class="cmd">./ship.sh</tspan>
  </text>
  <text class="line l6 accent" x="34" y="232">deploying AI agents to production...</text>

  <!-- blinking caret -->
  <rect class="caret" x="385" y="224" width="9" height="17"/>
</svg>
